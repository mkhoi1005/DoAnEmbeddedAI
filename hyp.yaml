# 📉 Learning rate & regularization
lr0: 0.002
lrf: 0.2
momentum: 0.937
weight_decay: 0.00025

# 🔥 Warmup
warmup_epochs: 3.0
warmup_momentum: 0.85
warmup_bias_lr: 0.15

# ⚖️ Loss weights
box: 0.05
cls: 0.5
dfl: 1.5


# ✨ Augmentations nhẹ, tránh làm sai lệch cấu trúc
hsv_h: 0.0
hsv_s: 0.0
hsv_v: 0.05

degrees: 2.0
translate: 0.03
scale: 0.2
shear: 0.03
perspective: 0.0002

flipud: 0.0
fliplr: 0.3

mosaic: 0.5
mixup: 0.1
copy_paste: 0.05
